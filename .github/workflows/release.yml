# tools.build — publish every image to GHCR on a v* tag, with SBOM + provenance
# (build-push-action attestations) and a keyless cosign signature (spec R8/R17).
# Hardened per R15: scoped permissions, repo guard, no persisted credentials.
#
# Callable two ways: directly on a `v*` tag push (a deliberate manual
# `git tag && git push`), or as a reusable workflow invoked by tag.yml once the
# `tag` action has tagged main — a GITHUB_TOKEN-pushed tag can't re-trigger this
# workflow's own tag-push event, so tag.yml calls it in-run instead via `uses:`
# and passes the tag it just created through the `tag` input.
name: release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z) to publish; defaults to the pushed tag ref'
        required: false
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write       # keyless cosign + provenance
  attestations: write

jobs:
  # Images other images build FROM must publish BEFORE their dependants, or a
  # dependant resolves its base from the PREVIOUS release. ci/go is
  # `FROM ghcr.io/nicerobot/tools.build/go-tooling:vMAJOR`, and in a single
  # parallel matrix it finished five minutes before that base was pushed —
  # shipping a ci/go whose toolchain was a release behind, silently.
  # Base images are built on a runner NATIVE to each architecture, then joined
  # into one manifest list. The alternative — one job emulating arm64 through
  # qemu — is not viable here: go-tooling compiles the whole pinned tool set
  # from source, cgo-linked libpg_query included, and under emulation that
  # overruns any sane timeout. This repository is public, so the arm64 runner
  # costs nothing, and each half builds at full speed on its own silicon.
  #
  # Each half pushes by DIGEST and carries no tag; a tag pushed twice would
  # leave whichever architecture finished last as the whole meaning of that
  # tag. The merge job below is what gives the digests a name.
  base-build:
    name: build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    if: github.repository == 'nicerobot/tools.build'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: go-tooling, context: go-tooling }
          - { name: node-tooling, context: node-tooling }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
      - name: export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The manifest list IS the release: it is what a consumer's tag resolves to,
  # and what cosign signs. Signing the list rather than either half means one
  # signature covers every architecture the tag can serve.
  base-images:
    name: publish ${{ matrix.image }}
    needs: base-build
    if: github.repository == 'nicerobot/tools.build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [go-tooling, node-tooling]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - id: meta
        # Derive the major alias from the SemVer tag (v2.1.0 -> v2; a bare v2 maps
        # to itself) so consumers pinning :vMAJOR always get the latest of that
        # major — the uniform container-versioning scheme: :vX.Y.Z, :vX, :latest.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "major=${TAG%%.*}" >> "$GITHUB_OUTPUT"
      - name: create and sign the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          MAJOR: ${{ steps.meta.outputs.major }}
        run: |
          # One artifact file per architecture, each named for its digest.
          # Collected into an array rather than an unquoted expansion so the
          # reference list cannot be resplit by whitespace.
          sources=()
          for file in *; do
            sources+=("${IMAGE}@sha256:${file}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:${MAJOR}" \
            --tag "${IMAGE}:latest" \
            "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "${IMAGE}@${digest}"

  images:
    name: publish ${{ matrix.image.name }}
    needs: base-images
    if: github.repository == 'nicerobot/tools.build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: runtime, context: runtime }
          - { name: ci/go, context: ci/go }
          - { name: ci/docs, context: ci/docs }
          - { name: ci/shell, context: ci/shell }
          - { name: ci/actions, context: ci/actions }
          - { name: ci/dockerfiles, context: ci/dockerfiles }
          - { name: ci/python, context: ci/python }
          - { name: ci/node, context: ci/node }
          - { name: ci/java, context: ci/java }
          - { name: ci/cpp, context: ci/cpp }
          - { name: ci/typescript, context: ci/typescript }
          - { name: ci/terraform, context: ci/terraform }
          - { name: ci/hugo, context: ci/hugo }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - id: meta
        # Derive the major alias from the SemVer tag (v2.1.0 -> v2; a bare v2 maps
        # to itself) so consumers pinning :vMAJOR always get the latest of that
        # major — the uniform container-versioning scheme: :vX.Y.Z, :vX, :latest.
        # TAG is the workflow_call input when tag.yml invokes this
        # workflow directly (its own tag push can't retrigger this workflow's
        # `on: push: tags` event), else the pushed tag ref itself.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "major=${TAG%%.*}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          # EVERY image is multi-arch. A developer's `make ci` and the pre-push
          # hook run these gates on the machine in front of them, and an
          # amd64-only gate on an arm64 laptop runs under qemu — minutes of
          # emulated build per push, which is what made the local gate feel
          # optional. These images are thin layers over multi-arch bases (a COPY,
          # at most one install), so qemu costs little HERE; the bases that
          # actually compile are built natively in base-build above.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image.name }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/${{ matrix.image.name }}:${{ steps.meta.outputs.major }}
            ghcr.io/${{ github.repository }}/${{ matrix.image.name }}:latest
          provenance: true
          sbom: true
      - name: cosign sign (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  major-tag:
    # Move the floating major git tag (v2.1.0 -> v2) to the release commit once
    # every image is published, so `uses: …/ci/<lang>@vMAJOR` consumers advance
    # atomically with the `:vMAJOR` image tags — no manual retag step. The
    # GITHUB_TOKEN tag push cannot retrigger this workflow's own tag event.
    name: move major tag
    needs: [base-images, images]
    if: github.repository == 'nicerobot/tools.build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          major="${TAG%%.*}"
          # Force the refspec: on the `on: push: tags` path (a manual
          # `git tag && git push`) the checkout already holds ${TAG}, and a
          # non-forced fetch of a ref that exists is rejected with "would
          # clobber existing tag" — which failed this job for every manually
          # cut tag while the tag.yml path, checking out main, passed.
          git fetch --depth 1 --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          git tag -f "${major}" "$(git rev-list -n1 "refs/tags/${TAG}")"
          git push -f origin "refs/tags/${major}"
