# Auto-tags main from conventional commits (release-please) and, when a
# release is cut, chains straight into release.yml's image-publish job.
#
# release-please's default GITHUB_TOKEN can create the release PR, merge-tag
# it, and cut the GitHub release, but a GITHUB_TOKEN-authored push can't
# retrigger another workflow's own `on: push` event — so publishing is NOT
# left to release.yml's `tags: ['v*']` trigger. Instead the `publish` job below
# calls release.yml in-run as a reusable workflow (`uses: ./...`), passing the
# tag release-please just created via its outputs. release.yml keeps its
# direct tag-push trigger too, for a manual `git tag && git push`.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'nicerobot/tools.build'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write   # release.yml's major-tag job force-pushes the floating vMAJOR tag
      packages: write
      id-token: write
      attestations: write
