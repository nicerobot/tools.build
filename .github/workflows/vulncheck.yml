# tools.build — scheduled CVE scan (spec R14) of the bundled Go toolchain. The
# toolchain version floats, but only a scheduled run actually re-scans, so a
# dependency CVE published with no code change is still caught here. Installs the
# pinned tools (go-tooling/tools.txt) and govulncheck-scans each baked binary.
# Hardened per R15: concurrency-cancel, timeout, repo-guarded schedule.
name: vulncheck

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'go-tooling/tools.txt'
      - 'scripts/go-tools-vulncheck.sh'
      - '.github/workflows/vulncheck.yml'

concurrency:
  group: vulncheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vulncheck:
    name: govulncheck
    # Forks do not run the schedule.
    if: github.event_name != 'schedule' || github.repository == 'nicerobot/tools.build'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: install the pinned tool set
        # Install exactly the manifest into $GOBIN — the same path local dev and
        # the go-tooling image use — so this scan covers the binaries CI ships.
        run: go-tooling/install-tools.sh
      - name: govulncheck (toolchain CVE scan)
        # Reachability scan of each baked binary (`-mode=binary`): precise per-tool
        # attribution, and it works now that tools install via `go install` with no
        # shared module. Derives the binary list from tools.txt so it can't drift.
        run: scripts/go-tools-vulncheck.sh
