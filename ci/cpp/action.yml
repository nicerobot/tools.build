name: "cpp gate"
description: "C/C++ quality gate — the consumer's make ci (CMake + ctest) in the pinned CMake/GCC image."
inputs:
  dir:
    description: "Directory holding the repo when it is checked out as a workspace subdirectory."
    required: false
    default: "."
runs:
  using: "docker"
  image: "docker://ghcr.io/nicerobot/tools.build/ci/cpp:v2.4.0"
