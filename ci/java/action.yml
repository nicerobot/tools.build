name: "java gate"
description: "JVM quality gate — the consumer's make ci (Gradle via its pinned wrapper) in the pinned Temurin JDK image."
inputs:
  dir:
    description: "Directory holding the repo when it is checked out as a workspace subdirectory."
    required: false
    default: "."
runs:
  using: "docker"
  image: "docker://ghcr.io/nicerobot/tools.build/ci/java:v2"
