name: "node gate"
description: "Node.js quality gate — npm ci + the consumer's make ci in the pinned Node image."
inputs:
  dir:
    description: "Directory holding the repo when it is checked out as a workspace subdirectory."
    required: false
    default: "."
runs:
  using: "docker"
  image: "docker://ghcr.io/nicerobot/tools.build/ci/node:v2"
