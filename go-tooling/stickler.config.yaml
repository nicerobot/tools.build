# Central stickler configuration for the gomatic Go toolchain — the GLOBAL layer
# every repo's `make lint` (which runs stickler) inherits. A repo's own
# .stickler.yaml layers OVER this (per-repo golangci overlays, runner selection).
#
# EVERY RULE GATES AT ZERO. There is no soft list, no probe list, and no
# baseline — not here, and not in a repository's own .stickler.yaml. A finding
# fails the build, whichever tool reported it.
#
# THIS FILE USED TO SAY THE OPPOSITE, AND THAT IS WHY IT SAYS THIS. It carried
# eleven rules under `soft:` and one under `probe:`, and its prose invited a
# repository to "soften it from its own .stickler.yaml", describing rules that
# "land soft with committed baselines and gate again at zero". An agent read
# that as permission — because it was permission — and recorded a baseline for
# code it had just written instead of fixing the finding. A ratchet meant for
# pre-existing backlog is a landing pad for new work the moment it exists.
#
# So the instrument is gone rather than narrowed. A finding is fixed in the code,
# or the analyzer that reported it is wrong and is fixed in the analyzer. Neither
# of those is a number in a config file.
#
# AN EXEMPTION IS NOT A BASELINE, AND IT IS NOT AN AGENT'S TO WRITE. Authorized
# exemptions — scoped to their reason, counted, and refusable — are designed
# elsewhere and are not invented here: the exemption scopes and the signed
# `.stickler.repo.lock` are specified in the yze statement-disablement work.
# Until that is built and an exemption carries the owner's signature, nothing
# excuses a finding. That is the intended state, not a gap.
