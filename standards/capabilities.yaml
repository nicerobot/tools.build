# capabilities.yaml — the canonical registry of every standard a repo can be
# measured against. Single source of truth, consumed by:
#   - the shared gate (build/go/Makefile): validates .standards.yaml exempt keys
#     against this registry and runs each gate capability's `raw` target.
#   - distribute / verify (tools.repository): maps managed artifacts to
#     artifact:* capabilities and probes gate:/convention: staleness.
#
# A repo's .standards.yaml may list any of these under `exempt:` (with a reason)
# to declare it does NOT yet satisfy that capability. The anti-rot ratchet then
# fails the moment an exempted capability actually passes — exemptions only shrink.
#
# Kinds:
#   artifact    — a managed file distribute injects; exempting it skips injection.
#   gate        — a mechanical check the shared gate runs; `raw` is the make target
#                 that runs JUST that check (the staleness probe).
#   convention  — a higher-level convention verified by a gomatic/analyzers/<name>/v1
#                 analyzer. RESERVED: inert until its analyzer ships (analyzer: false),
#                 at which point the ratchet begins applying to it.

capabilities:
  # ---- artifacts (distribute-injected managed files) --------------------------
  artifact:makefile:
    kind: artifact
    description: shared Go toolchain Makefile
  artifact:golangci:
    kind: artifact
    description: shared golangci-lint configuration
  artifact:workflow:go:
    kind: artifact
    description: Go CI workflow (.github/workflows/go.yml)
  artifact:workflow:actions:
    kind: artifact
    description: actions-lint workflow
  artifact:workflow:docs:
    kind: artifact
    description: docs/markdown workflow
  artifact:workflow:dockerfiles:
    kind: artifact
    description: Dockerfile-lint workflow
  artifact:workflow:shell:
    kind: artifact
    description: shell-lint workflow
  artifact:workflow:release:
    kind: artifact
    description: goreleaser release workflow
  artifact:dependabot:
    kind: artifact
    description: Dependabot version-update config (.github/dependabot.yml); per-ecosystem, majors ignored for version updates
  # The bundle AS A WHOLE, rather than one file within it. distribute routes a
  # repo to the plan it earns, and a worker www repo — a www.* name with a src/
  # tree, i.e. a Cloudflare Worker rather than a static site — matches neither
  # the static-www CI-gate route nor the default distributable set, so it earns
  # nothing at all. That is deliberate, but until now it was recorded ONLY in
  # distribute's source: from the repository's side, "deliberately outside
  # distribution" and "nobody ever looked" were indistinguishable, and
  # www.adm.one's workflows sat frozen for weeks without submodule checkout
  # because everyone assumed distribution covered them.
  #
  # Exempting this declares the opt-out where the repo can see it, with a reason,
  # and `git repo standards verify` reports any repo that earns no plan and has
  # NOT declared it — so the next one cannot go silent.
  artifact:build-bundle:
    kind: artifact
    description: the uniform build bundle as a whole (Makefile, configs, workflows); exempting it declares the repo manages its own build
  artifact:docstyle:
    kind: artifact
    description: distribute-docs Hugo style unit (layouts/ + assets/); exempt a docs repo that supplies its own theme (e.g. a Hugo module)

  # ---- gates (mechanical checks the shared gate runs) -------------------------
  gate:lint:
    kind: gate
    description: golangci-lint clean (incl. gocognit <=7, gosec, formatting)
    raw: lint-raw
  gate:staticcheck:
    kind: gate
    description: staticcheck clean
    raw: staticcheck-raw
  gate:vulncheck:
    kind: gate
    description: govulncheck clean
    raw: vulncheck-raw
  gate:coverage:
    kind: gate
    description: 100% aggregate statement coverage
    raw: cover
  # NOTE: there is deliberately no gate:nilaway. `make nilaway` is ADVISORY and
  # absent from check/ci — its nil-slice false-positive rate makes it unfit to
  # block, and an exemption written for a false positive is indistinguishable in
  # this ledger from one written for a real gap. See the target's comment.
  gate:deadcode:
    kind: gate
    description: no code unreachable from any entry point or test
    raw: deadcode-raw
  gate:tidy:
    kind: gate
    description: go.mod/go.sum are tidy (`go mod tidy -diff` clean) — no dependency in go.sum that nothing imports
    raw: tidy-check-raw

  # The docs gate and its two narrowings. They are separate capabilities rather
  # than one because they concede different amounts, and a ledger that cannot
  # tell them apart is not a ledger: gate:docs gives up the whole check,
  # gate:docs:paths keeps every rule and excludes named trees (a vendored skill
  # pack written to someone else's ruleset), and gate:docs:rules keeps every
  # file and drops one rule (a document of stacked top-level sections, which
  # MD025 reads as many titles).
  #
  # They had to be registered here: ci/docs/check honoured all three the day
  # they were written, but the registry did not know them, so `standards
  # verify` and distribute rejected the marker outright — three ixnai repos
  # failed to distribute with "unknown capability: gate:docs:paths".
  gate:docs:
    kind: gate
    description: markdown satisfies the shared docs ruleset (markdownlint + prettier + mermaid)
  gate:docs:paths:
    kind: gate
    description: comma-separated globs the docs gate skips; every other file stays fully gated
  gate:docs:rules:
    kind: gate
    description: comma-separated markdownlint rule ids disabled for this repo; every other rule still applies

  # ---- conventions (RESERVED — analyzers deferred to gomatic/analyzers/*/v1) ---
  convention:sentinel-errors:
    kind: convention
    description: errors are constant sentinels (type Error string); no errors.New / bare fmt.Errorf
    analyzer: false
  convention:error-wrap:
    kind: convention
    description: fmt.Errorf used only to %w-wrap a sentinel
    analyzer: false
  convention:named-params:
    kind: convention
    description: function/method params use named domain types, not bare primitives
    analyzer: false
  convention:value-receivers:
    kind: convention
    description: value receivers / immutable types unless a pointer is justified
    analyzer: false
  convention:private-by-default:
    kind: convention
    description: no exported symbol without an external consumer or interface need
    analyzer: false
  convention:cliv3:
    kind: convention
    description: CLIs use urfave/cli/v3 (not v1/v2)
    analyzer: true
  convention:cliversion:
    kind: convention
    description: a CLI's cmd/<app>/main.go declares `var version` and assigns it to the urfave Version field (--version; ldflags -X main.version target)
    analyzer: true
  convention:library-marker:
    kind: convention
    description: library repos carry the library.go build-tag marker
    analyzer: false

  # ---- classification (repo-class marker drift; verified live by the standards
  #      engine in `git repo standards verify`, not the per-repo make gate) -------
  # Keyed by the bare analyzer name (not dotted) because the standards engine's
  # exemption filter uses the analyzer's own name as the .standards.yaml key. A
  # root-go.mod module that is neither a CLI (cmd/<binary>/) nor a library
  # (library.go) — e.g. an integration-test harness or other non-distributable
  # module — exempts this to declare it is deliberately unclassified.
  classification:
    kind: convention
    description: a root-go.mod module carries exactly one class marker (cmd/<binary>/ or library.go, or an owner-granted root main.go)
    analyzer: true
  # Keyed by the bare analyzer name, like classification: the internal-content
  # analyzer flags spec(s)/doc(s) folders in any repo but the sanctioned homes
  # (the owner's _projects hub and docs.* repos). A template FOR a _projects hub
  # (template.org-_projects) is not itself named `.projects`, so it exempts this
  # to carry the templated specs/ layout.
  internal-content:
    kind: convention
    description: no spec(s)/doc(s) internal-content folder in a source repo (specs belong in <org>/_projects/specs/<repo>/, docs in docs.<repo>)
    analyzer: true
  # Keyed by the bare analyzer name, like classification and internal-content.
  # Separate from internal-content on the gate:docs precedent: the two concede
  # different things. internal-content sanctions two homes for documentation
  # (the _projects hub, docs.*); this rule sanctions NONE, because the objection
  # is duplicating the git history rather than where documentation lives. A repo
  # exempting internal-content must not silently acquire a changelog with it.
  # Root-anchored, so a vendored third-party changelog stays committable.
  changelog:
    kind: convention
    description: no root changelog (CHANGELOG*/CHANGES*/HISTORY.md/NEWS.md) in any repo — git log, the tags, and the GitHub release notes are the record
    analyzer: true
