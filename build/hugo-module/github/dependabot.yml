version: 2

# Version updates for a Hugo theme distributed as a Go module. Security updates
# are governed separately by the org's code-security configuration and need no
# entry here; this file only asks Dependabot to keep dependencies current in the
# absence of an advisory.
#
# There is no gomod entry. The module path exists solely so `hugo mod get` can
# resolve the theme — the go.mod declares no requirements, so a gomod ecosystem
# would poll a manifest that never changes. The workflows are the only versioned
# dependencies such a repo actually has.
#
# Major bumps are ignored deliberately. Fleet policy merges patch and minor
# automatically (nicerobot/tools.admin `radm dependabot-sweep`, gated on a green
# build) and reserves majors for human review, so opening major version-update
# pull requests would only accumulate noise nothing is allowed to merge.
#
# The ignore applies to *version* updates only. A security advisory whose fix
# exists solely across a major boundary still opens a pull request, because
# suppressing that would leave the repo silently vulnerable.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
