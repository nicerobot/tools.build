name: typescript
on:
  # Manually re-runnable. Re-running a PAST run replays its original commit, so
  # a gate that failed months ago stays red in the UI even after main was fixed —
  # there was no way to ask "is main green NOW?" without pushing a dummy commit.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: nicerobot/tools.build/ci/typescript@v2
