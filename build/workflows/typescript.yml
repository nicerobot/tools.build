name: typescript
on:
  push:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "biome.json*"
      - ".standards.yaml"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "biome.json*"
      - ".standards.yaml"
      - ".github/workflows/typescript.yml"
# __SCHEDULE_ON__
concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A submodule is part of the checkout, not an optional extra: a repo
          # that depends on one (www.adm.one carries pike and watchword) cannot
          # install or build without it, and the failure is an unresolvable
          # dependency rather than anything the gate can explain.
          submodules: recursive
      - uses: nicerobot/tools.build/ci/typescript@v2
