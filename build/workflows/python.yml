name: python
on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "uv.lock"
      - "poetry.lock"
      - "setup.cfg"
      - ".standards.yaml"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "uv.lock"
      - "poetry.lock"
      - "setup.cfg"
      - ".standards.yaml"
      - ".github/workflows/python.yml"
# __SCHEDULE_ON__
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A submodule is part of the checkout, not an optional extra: a repo
          # that depends on one (www.adm.one carries pike and watchword) cannot
          # install or build without it, and the failure is an unresolvable
          # dependency rather than anything the gate can explain.
          submodules: recursive
      - uses: nicerobot/tools.build/ci/python@v2
