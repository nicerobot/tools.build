name: python
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: nicerobot/tools.build/ci/python@v2
