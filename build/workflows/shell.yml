name: shell
on:
  # Manually re-runnable. Re-running a PAST run replays its original commit, so
  # a gate that failed months ago stays red in the UI even after main was fixed —
  # there was no way to ask "is main green NOW?" without pushing a dummy commit.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# __SCHEDULE_ON__
concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  shell:
    # A scheduled run re-lints against the floating ci/shell@v2 image with no push;
    # distribute substitutes the per-repo cron above. Skip forks (no-op for push/PR).
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: nicerobot/tools.build/ci/shell@v2
