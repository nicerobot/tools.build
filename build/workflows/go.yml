name: go
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# __SCHEDULE_ON__
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  go:
    # A scheduled run re-validates against the floating ci/go@v2 tool image, the
    # latest Go patch, and the current CVE database with no push. distribute
    # substitutes the per-repo cron above; the guard skips forks (and is a no-op
    # for push / pull_request, whose event name is never "schedule").
    if: github.event_name != 'schedule' || github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # GO_MODULE_TOKEN is only needed by a repo that depends on a PRIVATE
      # first-party module: those are absent from proxy.golang.org, so Go fetches
      # them straight from git and GITHUB_TOKEN cannot read them (it is scoped to
      # this repository alone). An org that defines no such secret passes the
      # empty string here, which the gate treats as "no private modules" — so
      # this line is inert for every repo that does not need it.
      - uses: nicerobot/tools.build/ci/go@v2
        with:
          token: ${{ secrets.GO_MODULE_TOKEN }}
