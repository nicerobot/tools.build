name: hugo
on:
  push:
    branches: [main]
    paths:
      - "hugo.json"
      - "hugo.yaml"
      - "hugo.toml"
      - "config/**"
      - "content/**"
      - "layouts/**"
      - "assets/**"
      - "static/**"
      - "**.md"
      - ".standards.yaml"
      - ".github/workflows/hugo.yml"
  pull_request:
    branches: [main]
    paths:
      - "hugo.json"
      - "hugo.yaml"
      - "hugo.toml"
      - "config/**"
      - "content/**"
      - "layouts/**"
      - "assets/**"
      - "static/**"
      - "**.md"
      - ".standards.yaml"
      - ".github/workflows/hugo.yml"
# __SCHEDULE_ON__
concurrency:
  group: hugo-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  hugo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nicerobot/tools.build/ci/hugo@v2
