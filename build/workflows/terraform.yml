name: terraform
on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tfvars.json"
      - ".terraform.lock.hcl"
      - ".standards.yaml"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tfvars.json"
      - ".terraform.lock.hcl"
      - ".standards.yaml"
      - ".github/workflows/terraform.yml"
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nicerobot/tools.build/ci/terraform@v2
