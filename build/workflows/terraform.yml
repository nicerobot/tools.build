name: terraform
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nicerobot/tools.build/ci/terraform@v2
